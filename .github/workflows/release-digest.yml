name: Release digest

# Plans the next SKE release digest email from the release-notes pages and
# writes it to the job outputs. A manual run with create_draft ticked also
# creates the email as a HubSpot draft, or regenerates the pending one; posts
# or updates its Slack message and schedules a ping for when the two business
# hour hold ends (with SLACK_BOT_TOKEN and the SLACK_DIGEST_CHANNEL variable);
# and commits the updated release record to the branch it ran on. Nothing is
# ever published or sent.

on:
  push:
    branches: [main]
    paths:
      - docs/ske/08-releases-and-support/**
      - scripts/release-digest/**
      - .github/workflows/release-digest.yml
  pull_request:
    paths:
      - scripts/release-digest/**
      - .github/workflows/release-digest.yml
  workflow_dispatch:
    inputs:
      create_draft:
        description: Also create or update the HubSpot draft, and commit the release record
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time per event type and branch (or pull request), so a manual
# run's record commit lands before the next manual run reads the record. A
# newer queued run replaces an older queued one of the same kind, which is
# fine: each run rebuilds the whole digest. Push runs only plan, so they queue
# separately and can never replace a waiting manual run.
concurrency:
  group: release-digest-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the release digest tool
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/release-digest/go.mod
          cache-dependency-path: scripts/release-digest/go.sum
      - name: Run the specs
        working-directory: scripts/release-digest
        run: go run github.com/onsi/ginkgo/v2/ginkgo -r --json-report=ginkgo-report.json --output-dir="$RUNNER_TEMP"
      # One line per spec in the log, and the same list on the run's summary page.
      - name: List each spec and its result
        if: always()
        run: |
          report="$RUNNER_TEMP/ginkgo-report.json"
          if [ ! -f "$report" ]; then
            echo "No spec report was written. The specs did not run; see the step above."
            exit 0
          fi
          lines=$(jq -r '.[] | .SuiteDescription as $suite | .SpecReports[]?
            | select(.LeafNodeType == "It")
            | "\(if .State == "passed" then "PASS" else (.State | ascii_upcase) end)  \($suite) › \(((.ContainerHierarchyTexts // []) + [.LeafNodeText]) | join(" › "))"' "$report" | sort -k2)
          passed=$(grep -c '^PASS' <<<"$lines" || true)
          total=$(grep -c . <<<"$lines" || true)
          echo "$passed of $total specs passed."
          echo
          echo "$lines"
          {
            echo "## Release digest specs: $passed of $total passed"
            echo
            echo '```'
            echo "$lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Plan the digest email
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.plan.outputs.has_releases }}
      release_ids: ${{ steps.plan.outputs.release_ids }}
      subject: ${{ steps.plan.outputs.subject }}
      html: ${{ steps.plan.outputs.html }}
      email_id: ${{ steps.plan.outputs.email_id }}
      draft_action: ${{ steps.plan.outputs.draft_action }}
      record_changed: ${{ steps.plan.outputs.record_changed }}
      send_not_before: ${{ steps.plan.outputs.send_not_before }}
    steps:
      # The branch's latest commit, not the one that started the run, so the
      # record includes the previous run's commit.
      - name: Check out the latest ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/release-digest/go.mod
          cache-dependency-path: scripts/release-digest/go.sum
      - name: Build the release digest command
        run: go -C scripts/release-digest build -o "$RUNNER_TEMP/release-digest" ./cmd/release-digest
      - name: Plan the digest${{ inputs.create_draft == true && ', then update the HubSpot draft and the Slack message' || ' (HubSpot and Slack are not contacted)' }}
        id: plan
        env:
          CREATE_DRAFT: ${{ inputs.create_draft == true }}
          # Only a manual run that asks for a draft gets the tokens.
          HUBSPOT_ACCESS_TOKEN: ${{ inputs.create_draft == true && secrets.HUBSPOT_ACCESS_TOKEN || '' }}
          SLACK_BOT_TOKEN: ${{ inputs.create_draft == true && secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_DIGEST_CHANNEL: ${{ vars.SLACK_DIGEST_CHANNEL }}
        run: |
          args=()
          if [ "$CREATE_DRAFT" = "true" ]; then
            echo "This run plans the digest, creates or updates the HubSpot draft, and posts or updates the Slack message and hold-end ping."
            args+=(-create-draft)
          else
            echo "This run only plans the digest. Run the workflow by hand with create_draft ticked to create or update the HubSpot draft."
          fi
          echo
          "$RUNNER_TEMP/release-digest" "${args[@]}"
      - name: Hand the updated release record to the next job
        if: steps.plan.outputs.record_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: scripts/release-digest/release-record.json
          retention-days: 7

  record:
    name: Commit the release record to ${{ github.ref_name }}
    needs: plan
    if: needs.plan.outputs.record_changed == 'true'
    runs-on: ubuntu-latest
    # Only this job can push, and only the release record.
    permissions:
      contents: write
    steps:
      - name: Check out the latest ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch the updated release record from the plan job
        uses: actions/download-artifact@v4
        with:
          name: release-record
          path: scripts/release-digest
      - name: Commit and push the release record
        env:
          EMAIL_ID: ${{ needs.plan.outputs.email_id }}
          DRAFT_ACTION: ${{ needs.plan.outputs.draft_action }}
          BRANCH: ${{ github.ref_name }}
        # Pushes made with GITHUB_TOKEN do not start new workflow runs.
        run: |
          if [ -n "$EMAIL_ID" ]; then
            echo "The plan job $DRAFT_ACTION HubSpot draft email $EMAIL_ID and changed the release record."
            message="chore(release-digest): record digest email $EMAIL_ID"
          else
            echo "The plan job changed the release record (for example, it cancelled the ping for a digest that has been sent)."
            message="chore(release-digest): update the release record"
          fi
          echo "Committing scripts/release-digest/release-record.json to $BRANCH:"
          echo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release-digest/release-record.json
          if git diff --cached --quiet; then
            echo "The release record on $BRANCH is already up to date. Nothing to commit."
            exit 0
          fi
          git --no-pager diff --cached
          git commit -q -m "$message"
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo
              echo "Pushed $(git rev-parse --short HEAD) to $BRANCH."
              echo "::notice title=Release record::Committed $(git rev-parse --short HEAD) to $BRANCH: $message"
              exit 0
            fi
            echo "Push attempt $attempt was rejected because $BRANCH moved. Rebasing and trying again."
            git pull -q --rebase origin "$BRANCH"
          done
          echo "Could not push the release record after 3 attempts." >&2
          exit 1
