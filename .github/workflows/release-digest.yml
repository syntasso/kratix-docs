name: Release digest

# Plans the next SKE release digest email from the release-notes pages and
# writes it to the job outputs. A push to main, or a manual run with
# create_draft ticked, also creates the email as a HubSpot draft, or
# regenerates the pending one; posts or updates its Slack message and
# schedules a ping for when the two business hour hold ends (with
# SLACK_BOT_TOKEN and the SLACK_DIGEST_CHANNEL variable); and commits the
# updated release record to the release-digest/record branch. Nothing is ever
# published or sent.
#
# The release record lives on its own branch, not on main, because main only
# takes changes through a pull request. Every run, whichever branch it runs
# on, reads and writes that one record.

on:
  push:
    branches: [main]
    paths:
      - docs/ske/08-releases-and-support/**
      - scripts/release-digest/**
      - .github/workflows/release-digest.yml
  pull_request:
    paths:
      - scripts/release-digest/**
      - .github/workflows/release-digest.yml
  workflow_dispatch:
    inputs:
      create_draft:
        description: Also create or update the HubSpot draft and the Slack message, and commit the release record to release-digest/record (pushes to main always do)
        type: boolean
        default: false

permissions:
  contents: read

# One writing run at a time across every branch, because they all share the
# record on release-digest/record: each run's record commit lands before the
# next writing run reads it. Pushes to main and manual runs with create_draft
# ticked, on any branch, share that queue. A newer queued run replaces an
# older queued one in the same queue, which is fine: each run rebuilds the
# whole digest and writes everything the older one would have. Runs that only
# plan (pull requests, manual runs without create_draft) queue separately, so
# they can never replace a waiting writing run.
concurrency:
  group: release-digest-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || ((github.event_name == 'push' || inputs.create_draft == true) && 'write' || format('{0}-plan', github.ref_name)) }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the release digest tool
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/release-digest/go.mod
          cache-dependency-path: scripts/release-digest/go.sum
      - name: Run the specs
        working-directory: scripts/release-digest
        run: go run github.com/onsi/ginkgo/v2/ginkgo -r --json-report=ginkgo-report.json --output-dir="$RUNNER_TEMP"
      # One line per spec in the log.
      - name: List each spec and its result
        if: always()
        run: |
          report="$RUNNER_TEMP/ginkgo-report.json"
          if [ ! -f "$report" ]; then
            echo "No spec report was written. The specs did not run; see the step above."
            exit 0
          fi
          lines=$(jq -r '.[] | .SuiteDescription as $suite | .SpecReports[]?
            | select(.LeafNodeType == "It")
            | "\(if .State == "passed" then "PASS" else (.State | ascii_upcase) end)  \($suite) › \(((.ContainerHierarchyTexts // []) + [.LeafNodeText]) | join(" › "))"' "$report" | sort -k2)
          passed=$(grep -c '^PASS' <<<"$lines" || true)
          total=$(grep -c . <<<"$lines" || true)
          echo "$passed of $total specs passed."
          echo
          echo "$lines"

  plan:
    name: Plan the digest email
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.plan.outputs.has_releases }}
      release_ids: ${{ steps.plan.outputs.release_ids }}
      subject: ${{ steps.plan.outputs.subject }}
      html: ${{ steps.plan.outputs.html }}
      email_id: ${{ steps.plan.outputs.email_id }}
      draft_action: ${{ steps.plan.outputs.draft_action }}
      record_changed: ${{ steps.plan.outputs.record_changed }}
      send_not_before: ${{ steps.plan.outputs.send_not_before }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/release-digest/go.mod
          cache-dependency-path: scripts/release-digest/go.sum
      # A missing record would make every release look new, so the run stops
      # rather than start from an empty one.
      - name: Fetch the release record from release-digest/record
        run: |
          if ! git fetch -q --depth=1 origin release-digest/record; then
            echo "::error title=Release record::The release-digest/record branch is missing. Restore it, with release-record.json, before running the digest again."
            exit 1
          fi
          git show FETCH_HEAD:release-record.json > "$RUNNER_TEMP/release-record.json"
          echo "Release record from release-digest/record at $(git rev-parse --short FETCH_HEAD)."
      - name: Build the release digest command
        run: go -C scripts/release-digest build -o "$RUNNER_TEMP/release-digest" ./cmd/release-digest
      - name: Plan the digest${{ (github.event_name == 'push' || inputs.create_draft == true) && ', then update the HubSpot draft and the Slack message' || ' (HubSpot and Slack are not contacted)' }}
        id: plan
        env:
          CREATE_DRAFT: ${{ (github.event_name == 'push' || inputs.create_draft == true) }}
          # Only a push to main, or a manual run that asks for a draft, gets the tokens.
          HUBSPOT_ACCESS_TOKEN: ${{ (github.event_name == 'push' || inputs.create_draft == true) && secrets.HUBSPOT_ACCESS_TOKEN || '' }}
          SLACK_BOT_TOKEN: ${{ (github.event_name == 'push' || inputs.create_draft == true) && secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_DIGEST_CHANNEL: ${{ vars.SLACK_DIGEST_CHANNEL }}
        run: |
          args=()
          if [ "$CREATE_DRAFT" = "true" ]; then
            echo "This run plans the digest, creates or updates the HubSpot draft, and posts or updates the Slack message and hold-end ping."
            args+=(-create-draft)
          else
            echo "This run only plans the digest. Pushes to main, and manual runs with create_draft ticked, create or update the HubSpot draft."
          fi
          echo
          "$RUNNER_TEMP/release-digest" -record "$RUNNER_TEMP/release-record.json" "${args[@]}"
      - name: Hand the updated release record to the next job
        if: steps.plan.outputs.record_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: ${{ runner.temp }}/release-record.json
          retention-days: 7

  record:
    # A plain name: GitHub does not fill in expressions in the name of a skipped job.
    name: Commit the release record
    needs: plan
    if: needs.plan.outputs.record_changed == 'true'
    runs-on: ubuntu-latest
    # Only this job can push, and only to release-digest/record.
    permissions:
      contents: write
    steps:
      - name: Check out release-digest/record
        uses: actions/checkout@v4
        with:
          ref: release-digest/record
      - name: Fetch the updated release record from the plan job
        uses: actions/download-artifact@v4
        with:
          name: release-record
      - name: Commit and push the release record to release-digest/record
        env:
          EMAIL_ID: ${{ needs.plan.outputs.email_id }}
          DRAFT_ACTION: ${{ needs.plan.outputs.draft_action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A push made with GITHUB_TOKEN does not start workflows, and no
        # workflow runs on release-digest/record anyway.
        run: |
          if [ -n "$EMAIL_ID" ]; then
            echo "The plan job $DRAFT_ACTION HubSpot draft email $EMAIL_ID and changed the release record."
            message="chore(release-digest): record digest email $EMAIL_ID"
          else
            echo "The plan job changed the release record (for example, it cancelled the ping for a digest that has been sent)."
            message="chore(release-digest): update the release record"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-record.json
          if git diff --cached --quiet; then
            echo "The release record on release-digest/record is already up to date. Nothing to commit."
            exit 0
          fi
          echo "Committing release-record.json:"
          echo
          git --no-pager diff --cached
          git commit -q -m "$message" -m "From $GITHUB_REF_NAME, run $RUN_URL"
          # Writing runs take turns, so the branch only moves if someone pushed
          # to it by hand. Show git's reason each time it refuses.
          for attempt in 1 2 3; do
            if git push -q origin HEAD:release-digest/record; then
              echo
              echo "Pushed $(git rev-parse --short HEAD) to release-digest/record."
              echo "::notice title=Release record::Committed $(git rev-parse --short HEAD) to release-digest/record: $message"
              exit 0
            fi
            echo "Push attempt $attempt was refused; see git's message above. Rebasing onto release-digest/record and trying again."
            git pull -q --rebase origin release-digest/record
          done
          echo "::error title=Release record::Could not push the release record to release-digest/record after 3 attempts. Its record is in this run's release-record artifact."
          exit 1
