name: Test Build

on:
  pull_request:
    # The site does not use the release digest tool, so a change to only
    # these files does not need a site build.
    paths-ignore:
      - scripts/release-digest/**
      - .github/workflows/release-digest.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: |
          corepack enable
          yarn install
      - run: yarn build
