name: Release digest

# Plans the next SKE release digest email from the release-notes pages and
# writes it to the job outputs. A push to main, or a manual run with
# create_draft ticked, also creates the email as a HubSpot draft, or
# regenerates the pending one; posts or updates its Slack message and
# schedules a ping for when the two business hour hold ends (with
# SLACK_BOT_TOKEN and the SLACK_DIGEST_CHANNEL variable); and commits the
# updated release record to the branch it ran on, through a pull request
# that someone merges. Until it is merged, runs that would write stop before
# contacting HubSpot or Slack. Nothing is ever published or sent.

on:
  push:
    branches: [main]
    paths:
      - docs/ske/08-releases-and-support/**
      - scripts/release-digest/**
      - .github/workflows/release-digest.yaml
  pull_request:
    paths:
      - scripts/release-digest/**
      - .github/workflows/release-digest.yaml
  workflow_dispatch:
    inputs:
      create_draft:
        description: Also create or update the HubSpot draft and the Slack message, and commit the release record (pushes to main always do)
        type: boolean
        default: false

permissions:
  contents: read

# One writing run at a time per branch, so each run's record commit lands
# before the next writing run reads the record. Pushes to main and manual runs
# with create_draft ticked share that queue. A newer queued run replaces an
# older queued one in the same queue, which is fine: each run rebuilds the
# whole digest and writes everything the older one would have. Runs that only
# plan (pull requests, manual runs without create_draft) queue separately, so
# they can never replace a waiting writing run.
concurrency:
  group: release-digest-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('{0}-{1}', github.ref_name, (github.event_name == 'push' || inputs.create_draft == true) && 'write' || 'plan') }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the release digest tool
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/release-digest/go.mod
          cache-dependency-path: scripts/release-digest/go.sum
      - name: Run the specs
        working-directory: scripts/release-digest
        run: go run github.com/onsi/ginkgo/v2/ginkgo -r --json-report=ginkgo-report.json --output-dir="$RUNNER_TEMP"
      # One line per spec in the log.
      - name: List each spec and its result
        if: always()
        run: |
          report="$RUNNER_TEMP/ginkgo-report.json"
          if [ ! -f "$report" ]; then
            echo "No spec report was written. The specs did not run; see the step above."
            exit 0
          fi
          lines=$(jq -r '.[] | .SuiteDescription as $suite | .SpecReports[]?
            | select(.LeafNodeType == "It")
            | "\(if .State == "passed" then "PASS" else (.State | ascii_upcase) end)  \($suite) › \(((.ContainerHierarchyTexts // []) + [.LeafNodeText]) | join(" › "))"' "$report" | sort -k2)
          passed=$(grep -c '^PASS' <<<"$lines" || true)
          total=$(grep -c . <<<"$lines" || true)
          echo "$passed of $total specs passed."
          echo
          echo "$lines"

  plan:
    name: Plan the digest email
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # pull-requests: read is for the check that no release record pull request
    # is waiting to be merged.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_releases: ${{ steps.plan.outputs.has_releases }}
      release_ids: ${{ steps.plan.outputs.release_ids }}
      subject: ${{ steps.plan.outputs.subject }}
      html: ${{ steps.plan.outputs.html }}
      email_id: ${{ steps.plan.outputs.email_id }}
      draft_action: ${{ steps.plan.outputs.draft_action }}
      record_changed: ${{ steps.plan.outputs.record_changed }}
      send_not_before: ${{ steps.plan.outputs.send_not_before }}
    steps:
      # The branch's latest commit, not the one that started the run, so the
      # record includes the previous run's commit.
      - name: Check out the latest ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/release-digest/go.mod
          cache-dependency-path: scripts/release-digest/go.sum
      # Each writing run's record goes into a pull request that someone merges.
      # Until it is merged, the record on this branch is out of date, so a run
      # that would write stops here, before contacting HubSpot or Slack.
      - name: Check no release record pull request is waiting to be merged
        if: github.event_name == 'push' || inputs.create_draft == true
        env:
          BASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh pr list --base "$BASE" --head "release-digest/record-$BASE" --state open --json url --jq '.[].url')
          if [ -n "$waiting" ]; then
            echo "::error title=Release record::Merge $waiting first. It holds the release record from an earlier run, and this run would work from the out-of-date record on $BASE. Merging it starts a new run."
            exit 1
          fi
          echo "No release record pull request is waiting to be merged into $BASE."
      - name: Build the release digest command
        run: go -C scripts/release-digest build -o "$RUNNER_TEMP/release-digest" ./cmd/release-digest
      - name: Plan the digest${{ (github.event_name == 'push' || inputs.create_draft == true) && ', then update the HubSpot draft and the Slack message' || ' (HubSpot and Slack are not contacted)' }}
        id: plan
        env:
          CREATE_DRAFT: ${{ (github.event_name == 'push' || inputs.create_draft == true) }}
          # Only a push to main, or a manual run that asks for a draft, gets the tokens.
          HUBSPOT_ACCESS_TOKEN: ${{ (github.event_name == 'push' || inputs.create_draft == true) && secrets.HUBSPOT_ACCESS_TOKEN || '' }}
          SLACK_BOT_TOKEN: ${{ (github.event_name == 'push' || inputs.create_draft == true) && secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_DIGEST_CHANNEL: ${{ vars.SLACK_DIGEST_CHANNEL }}
        run: |
          args=()
          if [ "$CREATE_DRAFT" = "true" ]; then
            echo "This run plans the digest, creates or updates the HubSpot draft, and posts or updates the Slack message and hold-end ping."
            args+=(-create-draft)
          else
            echo "This run only plans the digest. Pushes to main, and manual runs with create_draft ticked, create or update the HubSpot draft."
          fi
          echo
          "$RUNNER_TEMP/release-digest" "${args[@]}"
      - name: Hand the updated release record to the next job
        if: steps.plan.outputs.record_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: scripts/release-digest/release-record.json
          retention-days: 7

  record:
    # A plain name: GitHub does not fill in expressions in the name of a skipped job.
    name: Open a pull request for the release record
    needs: plan
    if: needs.plan.outputs.record_changed == 'true'
    runs-on: ubuntu-latest
    # Only this job can write, and only the release record. main only takes
    # changes through a pull request, and someone merges it.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the latest ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch the updated release record from the plan job
        uses: actions/download-artifact@v4
        with:
          name: release-record
          path: scripts/release-digest
      - name: Open a pull request for the release record into ${{ github.ref_name }}
        env:
          EMAIL_ID: ${{ needs.plan.outputs.email_id }}
          DRAFT_ACTION: ${{ needs.plan.outputs.draft_action }}
          BASE: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        # The record branch is pushed with GITHUB_TOKEN, so it does not start
        # this workflow; the pull request gets a run that waits for approval, and
        # nothing runs. Merging the pull request starts a run on the base branch.
        run: |
          if [ -n "$EMAIL_ID" ]; then
            echo "The plan job $DRAFT_ACTION HubSpot draft email $EMAIL_ID and changed the release record."
            message="chore(release-digest): record digest email $EMAIL_ID"
          else
            echo "The plan job changed the release record (for example, it cancelled the ping for a digest that has been sent)."
            message="chore(release-digest): update the release record"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release-digest/release-record.json
          if git diff --cached --quiet; then
            echo "The release record on $BASE is already up to date. Nothing to commit."
            exit 0
          fi
          echo "Committing scripts/release-digest/release-record.json:"
          echo
          git --no-pager diff --cached
          git commit -q -m "$message"

          # The plan job checked that no record pull request was open, so any
          # branch left with this name is from a merged or closed one.
          branch="release-digest/record-$BASE"
          git push -q --force origin "HEAD:refs/heads/$branch"
          echo
          echo "Pushed $(git rev-parse --short HEAD) to $branch."

          url=$(gh pr create --base "$BASE" --head "$branch" --title "$message" --body "$(cat <<BODY
          [Run $GITHUB_RUN_ID]($RUN_URL) updated the HubSpot draft and the Slack message, and this is the release record it saved.

          Merge this before anything else changes the release notes. Until it is merged, runs on $BASE that would update HubSpot or Slack stop before contacting them. Merging it starts a run that picks up any releases added in the meantime.
          BODY
          )")
          echo "Opened $url."
          echo "::warning title=Release record::Merge $url. Until it is merged, runs on $BASE that would update HubSpot or Slack stop before contacting them."
