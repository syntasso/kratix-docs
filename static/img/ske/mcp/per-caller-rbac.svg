<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img"
     aria-label="A user's identity provider group is checked against Kubernetes RoleBindings. A group with a RoleBinding reaches a Role and gets its permissions. A group with no RoleBinding reaches nothing and gets no permissions.">
  <rect width="1000" height="340" fill="#ffffff" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565b6b" />
    </marker>
    <marker id="arrowGranted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a5f" />
    </marker>
    <marker id="arrowDenied" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4622a" />
    </marker>
  </defs>

  <text x="150" y="28" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#565b6b">IDENTITY PROVIDER</text>
  <text x="480" y="28" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#565b6b">KUBERNETES RBAC</text>
  <text x="850" y="28" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#565b6b">RESULT</text>

  <line x1="320" y1="45" x2="320" y2="320" stroke="#d7d7d2" stroke-width="1.5" stroke-dasharray="3 5" />
  <text x="320" y="333" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#565b6b">cluster boundary</text>

  <!-- Row 1: group with a binding -->
  <rect x="40" y="55" width="220" height="60" rx="8" fill="#e8eafb" stroke="#4453c7" stroke-width="1.4" />
  <text x="150" y="80" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1e26">User in group</text>
  <text x="150" y="98" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#565b6b">platform-viewers</text>

  <line x1="260" y1="85" x2="345" y2="85" stroke="#565b6b" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="302" y="78" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#565b6b">group claim</text>

  <rect x="350" y="55" width="230" height="60" rx="8" fill="#ffffff" stroke="#d7d7d2" stroke-width="1.4" />
  <text x="465" y="78" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1e26">RoleBinding</text>
  <text x="465" y="96" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#565b6b">subject: Group platform-viewers</text>

  <line x1="580" y1="85" x2="700" y2="85" stroke="#1f8a5f" stroke-width="1.6" marker-end="url(#arrowGranted)" />

  <rect x="705" y="53" width="255" height="64" rx="8" fill="#e5f4ec" stroke="#1f8a5f" stroke-width="1.6" />
  <text x="832" y="79" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1e26">&#10003; permitted</text>
  <text x="832" y="98" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#565b6b">Role's rules apply</text>

  <!-- Row 2: group with no binding -->
  <rect x="40" y="230" width="220" height="60" rx="8" fill="#e8eafb" stroke="#4453c7" stroke-width="1.4" />
  <text x="150" y="255" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1e26">User in group</text>
  <text x="150" y="273" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#565b6b">sales-team</text>

  <line x1="260" y1="260" x2="345" y2="260" stroke="#565b6b" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="302" y="253" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#565b6b">group claim</text>

  <rect x="350" y="230" width="230" height="60" rx="8" fill="none" stroke="#565b6b" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="465" y="256" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-style="italic" fill="#565b6b">no RoleBinding for</text>
  <text x="465" y="273" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" font-style="italic" fill="#565b6b">group sales-team</text>

  <line x1="580" y1="260" x2="700" y2="260" stroke="#b4622a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDenied)" />

  <rect x="705" y="228" width="255" height="64" rx="8" fill="#f6e9de" stroke="#b4622a" stroke-width="1.4" stroke-dasharray="5 4" />
  <text x="832" y="254" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1e26">&#10007; no permissions</text>
  <text x="832" y="273" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#565b6b">nothing to reach</text>
</svg>
