<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 340" role="img"
     aria-label="A caller authenticates to their identity provider. The MCP server verifies the caller's token, then impersonates that caller when calling the Kubernetes API. A caller whose group matches a RoleBinding reaches a Role and gets its permissions. A caller with no matching RBAC binding for either their username or their group reaches nothing and gets no permissions, even though the server treated both callers identically.">
  <rect width="1240" height="340" fill="#ffffff" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565b6b" />
    </marker>
    <marker id="arrowGranted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a5f" />
    </marker>
    <marker id="arrowDenied" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4622a" />
    </marker>
  </defs>

  <text x="130" y="28" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#565b6b">1. IDENTITY PROVIDER</text>
  <text x="410" y="28" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#565b6b">2. MCP SERVER</text>
  <text x="720" y="28" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#565b6b">3. KUBERNETES RBAC</text>
  <text x="1090" y="28" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#565b6b">4. RESULT</text>

  <!-- Row 1: caller with a binding -->
  <rect x="20" y="55" width="220" height="60" rx="8" fill="#e8eafb" stroke="#4453c7" stroke-width="1.4" />
  <text x="130" y="80" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1e26">Caller in group</text>
  <text x="130" y="98" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#565b6b">platform-viewers</text>

  <line x1="240" y1="85" x2="305" y2="85" stroke="#565b6b" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="272" y="78" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#565b6b">OIDC token</text>

  <rect x="310" y="55" width="200" height="60" rx="8" fill="#ffffff" stroke="#d7d7d2" stroke-width="1.4" />
  <text x="410" y="76" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12.5" fill="#1c1e26">Verifies token,</text>
  <text x="410" y="93" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12.5" fill="#1c1e26">impersonates caller</text>

  <line x1="510" y1="85" x2="595" y2="85" stroke="#565b6b" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="552" y="78" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#565b6b">Impersonate-User/Group</text>

  <rect x="600" y="55" width="230" height="60" rx="8" fill="#ffffff" stroke="#d7d7d2" stroke-width="1.4" />
  <text x="715" y="76" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1e26">RoleBinding</text>
  <text x="715" y="94" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#565b6b">subject: Group platform-viewers</text>

  <line x1="830" y1="85" x2="945" y2="85" stroke="#1f8a5f" stroke-width="1.6" marker-end="url(#arrowGranted)" />

  <rect x="950" y="53" width="270" height="64" rx="8" fill="#e5f4ec" stroke="#1f8a5f" stroke-width="1.6" />
  <text x="1085" y="79" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1e26">&#10003; permitted</text>
  <text x="1085" y="98" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#565b6b">Role's rules apply</text>

  <!-- Row 2: caller with no binding -->
  <rect x="20" y="230" width="220" height="60" rx="8" fill="#e8eafb" stroke="#4453c7" stroke-width="1.4" />
  <text x="130" y="255" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1e26">Caller in group</text>
  <text x="130" y="273" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#565b6b">sales-team</text>

  <line x1="240" y1="260" x2="305" y2="260" stroke="#565b6b" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="272" y="253" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#565b6b">OIDC token</text>

  <rect x="310" y="230" width="200" height="60" rx="8" fill="#ffffff" stroke="#d7d7d2" stroke-width="1.4" />
  <text x="410" y="251" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12.5" fill="#1c1e26">Verifies token,</text>
  <text x="410" y="268" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12.5" fill="#1c1e26">impersonates caller</text>

  <line x1="510" y1="260" x2="595" y2="260" stroke="#565b6b" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="552" y="253" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#565b6b">Impersonate-User/Group</text>

  <rect x="600" y="230" width="230" height="60" rx="8" fill="none" stroke="#565b6b" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="715" y="256" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-style="italic" fill="#565b6b">no RoleBinding for</text>
  <text x="715" y="273" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-style="italic" fill="#565b6b">group sales-team</text>

  <line x1="830" y1="260" x2="945" y2="260" stroke="#b4622a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDenied)" />

  <rect x="950" y="228" width="270" height="64" rx="8" fill="#f6e9de" stroke="#b4622a" stroke-width="1.4" stroke-dasharray="5 4" />
  <text x="1085" y="254" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1e26">&#10007; no permissions</text>
  <text x="1085" y="273" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#565b6b">nothing to reach</text>

  <text x="620" y="320" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11.5" fill="#565b6b">The server treats both callers identically in steps 1 and 2 — the only difference is what Kubernetes finds in step 3.</text>
</svg>
